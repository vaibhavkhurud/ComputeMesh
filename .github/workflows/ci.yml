name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: computemesh
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: computemesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm --filter './packages/*' run build
        env:
          DATABASE_URL: postgresql://computemesh:test_password@localhost:5432/computemesh_test

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://computemesh:test_password@localhost:5432/computemesh_test
          REDIS_URL: redis://localhost:6379
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-only
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: testsecret

  go-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go tests
        working-directory: services/provider-agent
        run: go test ./... -v

      - name: Build Go agent
        working-directory: services/provider-agent
        run: go build -o bin/computemesh-agent ./cmd/agent
